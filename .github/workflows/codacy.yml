# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
  schedule:
    - cron: '24 10 * * 5'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Codacy CLI 在生成 SARIF 时可能因编码问题崩溃（已知上游问题），留下残缺 JSON。
      - name: Run Codacy Analysis CLI
        id: codacy
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
          fail-if-incomplete: false
          upload: false
          allow-network: false
          force-file-permissions: false

      - name: Validate SARIF output
        id: sarif
        run: |
          if [ ! -f results.sarif ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::results.sarif was not created."
            exit 0
          fi
          if python3 -c 'import json,sys; json.load(open("results.sarif", encoding="utf-8"))'; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "SARIF is valid."
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::results.sarif is truncated/invalid (Codacy SARIF generation failed). Skipping upload. CodeQL remains the primary security scan."
            ls -la results.sarif || true
            head -c 200 results.sarif || true
          fi

      - name: Upload SARIF results file
        if: steps.sarif.outputs.valid == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Report Codacy CLI status
        if: always()
        run: |
          echo "Codacy CLI outcome: ${{ steps.codacy.outcome }}"
          echo "SARIF valid: ${{ steps.sarif.outputs.valid }}"
          if [ "${{ steps.sarif.outputs.valid }}" != "true" ]; then
            echo "::notice::Codacy did not produce a usable SARIF. Security alerts continue to come from CodeQL."
          fi
