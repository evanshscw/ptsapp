# Create GitHub Issues for open High/Critical code scanning alerts.
# Runs after Codacy / CodeQL finish, and can also be triggered manually.

name: Code Scanning Issues

on:
  workflow_run:
    workflows:
      - "Codacy Security Scan"
      - "CodeQL Advanced"
    types:
      - completed
  workflow_dispatch:
  schedule:
    # Catch any alerts that were missed after scans
    - cron: "0 9 * * 1"

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  create-issues:
    name: Create High/Critical Issues
    runs-on: ubuntu-latest
    # For workflow_run, still process alerts even if the scan job failed
    # (SARIF may still have been partially uploaded).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    steps:
      - name: Create issues for High/Critical alerts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const severities = new Set(["critical", "high"]);
            const markerPrefix = "<!-- code-scanning-alert:";

            const alerts = await github.paginate(
              github.rest.codeScanning.listAlertsForRepo,
              {
                owner,
                repo,
                state: "open",
                per_page: 100,
              }
            );

            const targets = alerts.filter((alert) => {
              const severity = (
                alert.rule?.security_severity_level ||
                alert.rule?.severity ||
                ""
              ).toLowerCase();
              return severities.has(severity);
            });

            core.info(`Found ${targets.length} open High/Critical alert(s).`);

            const existingIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                labels: "security,code-scanning",
                per_page: 100,
              }
            );

            const tracked = new Set();
            for (const issue of existingIssues) {
              const match = issue.body?.match(
                /<!-- code-scanning-alert:(\d+) -->/
              );
              if (match) {
                tracked.add(Number(match[1]));
              }
            }

            // Ensure labels exist (ignore if already present)
            for (const label of [
              { name: "security", color: "B60205", description: "Security related" },
              { name: "code-scanning", color: "5319E7", description: "From GitHub code scanning" },
              { name: "high", color: "D93F0B", description: "High severity" },
              { name: "critical", color: "B60205", description: "Critical severity" },
            ]) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) {
                  core.warning(`Could not create label ${label.name}: ${error.message}`);
                }
              }
            }

            let created = 0;
            for (const alert of targets) {
              if (tracked.has(alert.number)) {
                core.info(`Skip alert #${alert.number}: issue already exists`);
                continue;
              }

              const severity = (
                alert.rule?.security_severity_level ||
                alert.rule?.severity ||
                "unknown"
              ).toLowerCase();
              const ruleId = alert.rule?.id || "unknown-rule";
              const ruleDesc =
                alert.rule?.description ||
                alert.rule?.name ||
                "Security finding";
              const location = alert.most_recent_instance?.location;
              const path = location?.path || "unknown";
              const startLine = location?.start_line;
              const locText =
                startLine != null ? `${path}:${startLine}` : path;
              const tool = alert.tool?.name || "code scanning";
              const alertUrl = alert.html_url;

              const title = `[${severity.toUpperCase()}] ${ruleDesc} (${ruleId})`;
              const body = [
                `${markerPrefix}${alert.number} -->`,
                "",
                `## Code scanning alert #${alert.number}`,
                "",
                `| Field | Value |`,
                `| --- | --- |`,
                `| Severity | \`${severity}\` |`,
                `| Rule | \`${ruleId}\` |`,
                `| Tool | ${tool} |`,
                `| Location | \`${locText}\` |`,
                `| Alert | ${alertUrl} |`,
                "",
                "### Description",
                "",
                ruleDesc,
                "",
                "### Next steps",
                "",
                "1. Review the alert details in the Security tab.",
                "2. Confirm exploitability / false positive.",
                "3. Fix in a PR or dismiss with a reason if not applicable.",
                "",
                "_Auto-created by the Code Scanning Issues workflow._",
              ].join("\n");

              const labels = ["security", "code-scanning", severity];
              const issue = await github.rest.issues.create({
                owner,
                repo,
                title: title.slice(0, 250),
                body,
                labels,
              });

              created += 1;
              core.info(
                `Created issue #${issue.data.number} for alert #${alert.number}`
              );
            }

            core.info(`Done. Created ${created} new issue(s).`);
