# Create GitHub Issues for open High/Critical code scanning alerts.
# Runs after Codacy / CodeQL finish, and can also be triggered manually.

name: Code Scanning Issues

on:
  workflow_run:
    workflows:
      - "Codacy Security Scan"
      - "CodeQL Advanced"
    types:
      - completed
  workflow_dispatch:
  schedule:
    # Catch any alerts that were missed after scans
    - cron: "0 9 * * 1"

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  create-issues:
    name: Create High/Critical Issues
    runs-on: ubuntu-latest
    # For workflow_run, still process alerts even if the scan job failed
    # (SARIF may still have been partially uploaded).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    steps:
      - name: Create issues for High/Critical alerts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const severities = new Set(["critical", "high"]);
            const markerPrefix = "<!-- code-scanning-alert:";

            const alerts = await github.paginate(
              github.rest.codeScanning.listAlertsForRepo,
              {
                owner,
                repo,
                state: "open",
                per_page: 100,
              }
            );

            const targets = alerts.filter((alert) => {
              const severity = (
                alert.rule?.security_severity_level ||
                alert.rule?.severity ||
                ""
              ).toLowerCase();
              return severities.has(severity);
            });

            core.info(`共发现 ${targets.length} 条打开的 High/Critical 告警。`);

            const existingIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                labels: "security,code-scanning",
                per_page: 100,
              }
            );

            const tracked = new Set();
            for (const issue of existingIssues) {
              const match = issue.body?.match(
                /<!-- code-scanning-alert:(\d+) -->/
              );
              if (match) {
                tracked.add(Number(match[1]));
              }
            }

            const severityLabel = {
              critical: "严重",
              high: "高危",
            };

            // CodeQL / Codacy 规则中文说明（按 rule id 优先，其次英文描述）
            const ruleZhById = {
              "py/weak-sensitive-data-hashing":
                "对敏感数据使用了脆弱或弱加密哈希算法",
              "js/incomplete-sanitization": "字符串转义或不完整编码",
              "js/prototype-pollution-utility": "存在原型污染风险的工具函数",
              "js/clear-text-cookie": "敏感 Cookie 以明文方式传输",
              "py/stack-trace-exposure": "通过异常信息泄露内部细节",
              "actions/missing-workflow-permissions":
                "工作流未声明最小权限 permissions",
            };
            const ruleZhByDesc = {
              "Use of a broken or weak cryptographic hashing algorithm on sensitive data":
                "对敏感数据使用了脆弱或弱加密哈希算法",
              "Incomplete string escaping or encoding": "字符串转义或不完整编码",
              "Prototype-polluting function": "存在原型污染风险的工具函数",
              "Clear text transmission of sensitive cookie":
                "敏感 Cookie 以明文方式传输",
              "Information exposure through an exception":
                "通过异常信息泄露内部细节",
              "Workflow does not contain permissions":
                "工作流未声明最小权限 permissions",
            };

            function localizeRule(ruleId, ruleDesc) {
              return (
                ruleZhById[ruleId] ||
                ruleZhByDesc[ruleDesc] ||
                ruleDesc ||
                "安全发现问题"
              );
            }

            // Ensure labels exist (ignore if already present)
            for (const label of [
              { name: "security", color: "B60205", description: "安全相关" },
              { name: "code-scanning", color: "5319E7", description: "来自 GitHub 代码扫描" },
              { name: "high", color: "D93F0B", description: "高危" },
              { name: "critical", color: "B60205", description: "严重" },
            ]) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) {
                  core.warning(`无法创建标签 ${label.name}: ${error.message}`);
                }
              }
            }

            let created = 0;
            for (const alert of targets) {
              if (tracked.has(alert.number)) {
                core.info(`跳过告警 #${alert.number}：对应 Issue 已存在`);
                continue;
              }

              const severity = (
                alert.rule?.security_severity_level ||
                alert.rule?.severity ||
                "unknown"
              ).toLowerCase();
              const severityZh = severityLabel[severity] || severity.toUpperCase();
              const ruleId = alert.rule?.id || "unknown-rule";
              const ruleDescEn =
                alert.rule?.description ||
                alert.rule?.name ||
                "Security finding";
              const ruleDescZh = localizeRule(ruleId, ruleDescEn);
              const location = alert.most_recent_instance?.location;
              const path = location?.path || "未知路径";
              const startLine = location?.start_line;
              const locText =
                startLine != null ? `${path}:${startLine}` : path;
              const tool = alert.tool?.name || "code scanning";
              const alertUrl = alert.html_url;

              const title = `[${severityZh}] ${ruleDescZh} (${ruleId})`;
              const body = [
                `${markerPrefix}${alert.number} -->`,
                "",
                `## 代码扫描告警 #${alert.number}`,
                "",
                `| 字段 | 内容 |`,
                `| --- | --- |`,
                `| 严重级别 | ${severityZh} (\`${severity}\`) |`,
                `| 规则 | \`${ruleId}\` |`,
                `| 扫描工具 | ${tool} |`,
                `| 位置 | \`${locText}\` |`,
                `| 告警链接 | ${alertUrl} |`,
                "",
                "### 问题说明",
                "",
                ruleDescZh,
                "",
                `原文：${ruleDescEn}`,
                "",
                "### 处理建议",
                "",
                "1. 在 Security → Code scanning 中查看完整告警详情。",
                "2. 确认是否可利用，或判断是否为误报。",
                "3. 通过 PR 修复；若不适用，在告警中关闭并填写原因。",
                "",
                "_本 Issue 由 Code Scanning Issues 工作流自动创建。_",
              ].join("\n");

              const labels = ["security", "code-scanning", severity];
              const issue = await github.rest.issues.create({
                owner,
                repo,
                title: title.slice(0, 250),
                body,
                labels,
              });

              created += 1;
              core.info(
                `已为告警 #${alert.number} 创建 Issue #${issue.data.number}`
              );
            }

            core.info(`完成。新创建 ${created} 个 Issue。`);
