name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  mysql-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.docker_cache
          key: ${{ runner.os }}-docker-${{ matrix.python-version }}-${{ hashFiles('**/Dockerfile*', '**/requirements.txt') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create temporary Dockerfile with Python ${{ matrix.python-version }}
        run: |
          # Save original Dockerfile.my
          cp ruoyi-fastapi-backend/Dockerfile.my ruoyi-fastapi-backend/Dockerfile.my.bak
          # Create temporary Dockerfile with target Python version and default PyPI index
          sed -e "s/FROM python:3.10/FROM python:${{ matrix.python-version }}/g" \
              -e 's| -i https://pypi.tuna.tsinghua.edu.cn/simple||g' \
              ruoyi-fastapi-backend/Dockerfile.my.bak > ruoyi-fastapi-backend/Dockerfile.my

      - name: Start services with docker-compose
        run: |
          cd ruoyi-fastapi-test
          docker compose -f docker-compose.test.my.yml up -d --build

      - name: Wait for services to be ready
        run: |
          cd ruoyi-fastapi-test
          COMPOSE="docker compose -f docker-compose.test.my.yml"

          echo "Waiting for MySQL / Redis to become healthy..."
          timeout 360 bash -c "until $COMPOSE ps ruoyi-mysql | grep -q '(healthy)'; do sleep 5; done"
          timeout 120 bash -c "until $COMPOSE ps ruoyi-redis | grep -q '(healthy)'; do sleep 5; done"

          echo "Waiting for backend / frontend containers..."
          timeout 240 bash -c "until $COMPOSE ps ruoyi-backend-my | grep -q 'Up'; do sleep 5; done"
          timeout 180 bash -c "until $COMPOSE ps ruoyi-frontend | grep -q 'Up'; do sleep 5; done"

          echo "Checking if backend API is ready..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9099/captchaImage > /dev/null 2>&1; then
              echo "Backend service is ready!"
              exit 0
            fi

            # 若后端因短暂连库失败退出，主动拉起（配合 restart: on-failure）
            if ! $COMPOSE ps ruoyi-backend-my | grep -q 'Up'; then
              echo "Backend is not Up; restarting ruoyi-backend-my... ($i/60)"
              $COMPOSE restart ruoyi-backend-my || $COMPOSE up -d ruoyi-backend-my
            else
              echo "Waiting for backend service to be ready... ($i/60)"
            fi
            sleep 5
          done

          echo "Backend service failed to start properly. Dumping logs..."
          $COMPOSE ps
          docker logs ruoyi-mysql-test --tail 100 || true
          docker logs ruoyi-backend-my-test --tail 200 || true
          exit 1

      - name: Run tests
        run: |
          cd ruoyi-fastapi-test
          pip install -r requirements.txt
          playwright install
          pytest -v

      - name: Stop services
        if: always()
        run: |
          cd ruoyi-fastapi-test
          docker compose -f docker-compose.test.my.yml down

      - name: Restore original Dockerfile.my
        if: always()
        run: |
          # Restore original Dockerfile.my after test
          mv ruoyi-fastapi-backend/Dockerfile.my.bak ruoyi-fastapi-backend/Dockerfile.my

  pg-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.docker_cache
          key: ${{ runner.os }}-docker-${{ matrix.python-version }}-${{ hashFiles('**/Dockerfile*', '**/requirements.txt') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create temporary Dockerfile with Python ${{ matrix.python-version }}
        run: |
          # Save original Dockerfile.pg
          cp ruoyi-fastapi-backend/Dockerfile.pg ruoyi-fastapi-backend/Dockerfile.pg.bak
          # Create temporary Dockerfile with target Python version and default PyPI index
          sed -e "s/FROM python:3.10/FROM python:${{ matrix.python-version }}/g" \
              -e 's| -i https://pypi.tuna.tsinghua.edu.cn/simple||g' \
              ruoyi-fastapi-backend/Dockerfile.pg.bak > ruoyi-fastapi-backend/Dockerfile.pg

      - name: Start services with docker-compose
        run: |
          cd ruoyi-fastapi-test
          docker compose -f docker-compose.test.pg.yml up -d --build

      - name: Wait for services to be ready
        run: |
          cd ruoyi-fastapi-test
          COMPOSE="docker compose -f docker-compose.test.pg.yml"

          echo "Waiting for PostgreSQL / Redis to become healthy..."
          timeout 360 bash -c "until $COMPOSE ps ruoyi-pg | grep -q '(healthy)'; do sleep 5; done"
          timeout 120 bash -c "until $COMPOSE ps ruoyi-redis | grep -q '(healthy)'; do sleep 5; done"

          echo "Waiting for backend / frontend containers..."
          timeout 240 bash -c "until $COMPOSE ps ruoyi-backend-pg | grep -q 'Up'; do sleep 5; done"
          timeout 180 bash -c "until $COMPOSE ps ruoyi-frontend | grep -q 'Up'; do sleep 5; done"

          echo "Checking if backend API is ready..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9099/captchaImage > /dev/null 2>&1; then
              echo "Backend service is ready!"
              exit 0
            fi

            if ! $COMPOSE ps ruoyi-backend-pg | grep -q 'Up'; then
              echo "Backend is not Up; restarting ruoyi-backend-pg... ($i/60)"
              $COMPOSE restart ruoyi-backend-pg || $COMPOSE up -d ruoyi-backend-pg
            else
              echo "Waiting for backend service to be ready... ($i/60)"
            fi
            sleep 5
          done

          echo "Backend service failed to start properly. Dumping logs..."
          $COMPOSE ps
          docker logs ruoyi-pg-test --tail 100 || true
          docker logs ruoyi-backend-pg-test --tail 200 || true
          exit 1

      - name: Run tests
        run: |
          cd ruoyi-fastapi-test
          pip install -r requirements.txt
          playwright install
          pytest -v

      - name: Stop services
        if: always()
        run: |
          cd ruoyi-fastapi-test
          docker compose -f docker-compose.test.pg.yml down

      - name: Restore original Dockerfile.pg
        if: always()
        run: |
          # Restore original Dockerfile.pg after test
          mv ruoyi-fastapi-backend/Dockerfile.pg.bak ruoyi-fastapi-backend/Dockerfile.pg
